<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediCare AI | Your health, clearer</title>
    <meta
      name="description"
      content="MediCare AI helps you understand your health, track vital signs, and stay on top of everyday care."
    />
    <meta property="og:title" content="MediCare AI | Your health, clearer" />
    <meta
      property="og:description"
      content="A calmer, clearer way to track your health and make informed care decisions."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      const savedTheme = localStorage.getItem('medicare.theme')
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
      if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
